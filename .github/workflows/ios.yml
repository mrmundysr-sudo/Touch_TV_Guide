name: iOS CI
on:
  push:
    branches: ['claude/ios', 'claude/ios-*']
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Core package tests (parser, rules, repository)
        working-directory: Packages/TVGuideCore
        run: |
          set -o pipefail
          swift test 2>&1 | tee ../../core-tests.log
          grep -E "Executed [0-9]+ tests" ../../core-tests.log | tail -1
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Pick an iPhone simulator
        id: sim
        run: |
          name=$(xcrun simctl list devices available | grep -E "iPhone [0-9]+ \(" | head -1 | sed -E 's/^ *(iPhone [^(]*[^ (]) \(.*/\1/')
          echo "device=$name" >> "$GITHUB_OUTPUT"; echo "Using: $name"
      - name: Build and test app (iPhone simulator)
        run: |
          set +e
          xcodebuild test -project TouchTVGuide.xcodeproj -scheme TouchTVGuide \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            CODE_SIGNING_ALLOWED=NO -resultBundlePath TestResults.xcresult > app-tests.log 2>&1
          status=$?
          echo "xcodebuild exit status: $status"
          echo "---- errors ----"; grep -E "error:|\*\* (TEST|BUILD) " app-tests.log | sort -u | head -80
          echo "---- test summary ----"; grep -E "Test Suite '.*' (passed|failed)|Executed [0-9]+ tests|Test Case .* failed" app-tests.log | tail -40
          exit $status
      - name: Release configuration compile check (live feed gate ON)
        run: |
          set -o pipefail
          xcodebuild build -project TouchTVGuide.xcodeproj -scheme TouchTVGuide -configuration Release \
            -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO -derivedDataPath build-release 2>&1 | tail -5
          plutil -extract TVGLiveFeedEnabled raw "build-release/Build/Products/Release-iphonesimulator/TouchTVGuide.app/Info.plist" | grep -qx YES
      - name: Archive check (unsigned, proves the TestFlight archive configuration builds)
        run: |
          set -o pipefail
          xcodebuild archive -project TouchTVGuide.xcodeproj -scheme TouchTVGuide -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/TouchTVGuide.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tail -5
          test -d build/TouchTVGuide.xcarchive/Products/Applications/TouchTVGuide.app
          plutil -p build/TouchTVGuide.xcarchive/Products/Applications/TouchTVGuide.app/Info.plist | grep -E -A4 "CFBundleIdentifier|CFBundleIconName|MinimumOSVersion|ITSAppUsesNonExemptEncryption|UISupportedInterfaceOrientations"
          test -f build/TouchTVGuide.xcarchive/Products/Applications/TouchTVGuide.app/PrivacyInfo.xcprivacy
      - name: Package simulator build (unsigned)
        run: |
          cd "build-release/Build/Products/Release-iphonesimulator" && zip -qr "$GITHUB_WORKSPACE/TouchTVGuide-simulator-Release.zip" "TouchTVGuide.app"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-logs-and-results
          path: |
            core-tests.log
            app-tests.log
            TestResults.xcresult
      - uses: actions/upload-artifact@v4
        with:
          name: TouchTVGuide-simulator-Release-unsigned
          path: TouchTVGuide-simulator-Release.zip
