name: TouchTVGuide
options:
  bundleIdPrefix: com.touch
  deploymentTarget: { iOS: "17.0" }
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"          # iPhone
    CODE_SIGN_STYLE: Automatic
    # --- Feed gate -------------------------------------------------------------------------------
    # YES: the app downloads the live EPGTalk guide. NO: only the labelled Sample preview data is available.
    # Owner decision (2026-11-06): live listings stay ON for the owner's TestFlight testing while the EPGTalk
    # reply is pending. The written terms are still NOT recorded (docs/EPGTALK_PERMISSION.md), so set this to
    # "NO" again before any public release / external testers unless the terms allow it.
    TVG_LIVE_FEED_ENABLED: "YES"
packages:
  TVGuideCore:
    path: Packages/TVGuideCore
targets:
  TouchTVGuide:
    type: application
    platform: iOS
    sources:
      - path: App/TouchTVGuide
    dependencies:
      - package: TVGuideCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.touch.tvguide
        PRODUCT_NAME: TouchTVGuide
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/TouchTVGuide/Info.plist
    scheme:
      testTargets: [TouchTVGuideTests, TouchTVGuideUITests]
      gatherCoverageData: false
  TouchTVGuideTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/TouchTVGuideTests
    dependencies:
      - target: TouchTVGuide
      - package: TVGuideCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.touch.tvguide.tests
        GENERATE_INFOPLIST_FILE: YES
  TouchTVGuideUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/TouchTVGuideUITests
    dependencies:
      - target: TouchTVGuide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.touch.tvguide.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TouchTVGuide
